name: render_workflows
description: >-
  Unofficial Dart client for Render Workflows: start, watch and cancel task
  runs. Not affiliated with or endorsed by Render.
version: 0.1.1

repository: https://github.com/timmaffett/render_workflows_sdk
issue_tracker: https://github.com/timmaffett/render_workflows_sdk/issues
topics:
  - render
  - workflows
  - tasks
  - background-jobs

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.2.0
  meta: ^1.15.0
  # This package builds on render_api rather than duplicating its transport,
  # errors and pagination — so the two move together, and a breaking change
  # there is a breaking change here.
  render_api: ^0.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
